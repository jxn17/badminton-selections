services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-badminton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-badminton}
      POSTGRES_DB: ${POSTGRES_DB:-badminton}
    ports:
      # Host port configurable to avoid clashing with a local Postgres on 5432.
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badminton"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local all-in-one (API + built frontend) using the root Dockerfile — mirrors
  # the Railway deploy. Visit http://localhost:8000 after it boots.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-badminton}:${POSTGRES_PASSWORD:-badminton}@db:5432/${POSTGRES_DB:-badminton}
      ADMIN_ACCESS_CODE: ${ADMIN_ACCESS_CODE:-trials2026}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8000}
      PORT: "8000"
    ports:
      - "8000:8000"

volumes:
  pgdata:
